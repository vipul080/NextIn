spring:
  application:
    name: NextIn

  datasource:
    url: jdbc:postgresql://localhost:5432/nextin
    username: nextin
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  config:
    import: optional:file:.env[.properties]

server:
  port: 8082
